<svg xmlns="http://www.w3.org/2000/svg" width="640" height="338" viewBox="0 0 640 338" role="img" aria-labelledby="title desc">
  <title id="title">Consecutive groups after sorting</title>
  <desc id="desc">Eight members are sorted from longer-lasting to shorter-lasting. Adjacent ranks are paired: one and two, three and four, five and six, seven and eight.</desc>
  <rect width="640" height="338" rx="8" fill="#f7f6f0"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#22251f">
    <text x="36" y="49" font-size="25" font-weight="600">Group neighbors in the ordering</text>
    <text x="36" y="100" font-size="21">Longer-lasting</text><text x="604" y="100" text-anchor="end" font-size="21">Shorter-lasting</text>
    <path d="M36 119H598L590 115M598 119L590 123" stroke="#808675" stroke-width="1.5" fill="none"/>
    <g stroke="#88917c" fill="#e8eddf">
      <rect x="36" y="155" width="130" height="92" rx="9"/>
      <rect x="182" y="155" width="130" height="92" rx="9"/>
      <rect x="328" y="155" width="130" height="92" rx="9"/>
      <rect x="474" y="155" width="130" height="92" rx="9"/>
    </g>
    <g font-size="28" text-anchor="middle">
      <text x="101" y="210">1 · 2</text><text x="247" y="210">3 · 4</text>
      <text x="393" y="210">5 · 6</text><text x="539" y="210">7 · 8</text>
    </g>
    <text x="36" y="296" font-size="21" fill="#5a5e53">A pair works only while both members survive.</text>
  </g>
</svg>
