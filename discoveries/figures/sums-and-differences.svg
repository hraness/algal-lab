<svg xmlns="http://www.w3.org/2000/svg" width="640" height="418" viewBox="0 0 640 418" role="img" aria-labelledby="title desc">
  <title id="title">One set, six sums, seven differences</title>
  <desc id="desc">For A = {0, 1, 3}, A+A = {0, 1, 2, 3, 4, 6}, while A−A = {−3, −2, −1, 0, 1, 2, 3}. Each dot is a distinct outcome.</desc>
  <rect width="640" height="418" rx="8" fill="#f7f6f0"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#22251f">
    <text x="36" y="50" font-size="26" font-weight="600">Start with A = {0, 1, 3}</text>
    <text x="36" y="111" font-size="24">Add every pair</text>
    <path d="M68 157H572" stroke="#c6cabe" stroke-width="2"/>
    <g fill="#374d31">
      <circle cx="68" cy="157" r="9"/><circle cx="152" cy="157" r="9"/>
      <circle cx="236" cy="157" r="9"/><circle cx="320" cy="157" r="9"/>
      <circle cx="404" cy="157" r="9"/><circle cx="572" cy="157" r="9"/>
    </g>
    <g font-size="23" text-anchor="middle">
      <text x="68" y="194">0</text><text x="152" y="194">1</text><text x="236" y="194">2</text>
      <text x="320" y="194">3</text><text x="404" y="194">4</text><text x="572" y="194">6</text>
    </g>
    <text x="36" y="253" font-size="24">Subtract every pair</text>
    <path d="M68 298H572" stroke="#c6cabe" stroke-width="2"/>
    <g fill="#8f5d2b">
      <circle cx="68" cy="298" r="9"/><circle cx="152" cy="298" r="9"/>
      <circle cx="236" cy="298" r="9"/><circle cx="320" cy="298" r="9"/>
      <circle cx="404" cy="298" r="9"/><circle cx="488" cy="298" r="9"/><circle cx="572" cy="298" r="9"/>
    </g>
    <g font-size="23" text-anchor="middle">
      <text x="68" y="336">−3</text><text x="152" y="336">−2</text><text x="236" y="336">−1</text>
      <text x="320" y="336">0</text><text x="404" y="336">1</text><text x="488" y="336">2</text><text x="572" y="336">3</text>
    </g>
    <text x="36" y="388" font-size="21" fill="#5a5e53">Count each distinct answer once.</text>
  </g>
</svg>
