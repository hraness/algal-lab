<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">Exact reflection constants through four sites</title>
  <desc id="desc">One, two, three and four sites have exact suprema 1, 1.25, 1.5 and 1.75. Five sites have lower bound 2 and upper bound 35/16, or 2.1875.</desc>
  <rect width="640" height="460" rx="8" fill="#f7f6f0"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#22251f">
    <text x="36" y="49" font-size="25" font-weight="600">The price of reflection</text>
    <text x="36" y="80" font-size="20" fill="#5a5e53">Largest reflected ratio</text>
    <g stroke="#dddfd5" stroke-width="1">
      <path d="M180 113V358M325 113V358M470 113V358"/>
    </g>
    <g font-size="23">
      <text x="36" y="141">1 site</text><text x="36" y="204">2 sites</text>
      <text x="36" y="267">3 sites</text><text x="36" y="330">4 sites</text>
    </g>
    <g stroke="#75806a" stroke-width="5">
      <path d="M180 134H325M180 197H361.25M180 260H397.5M180 323H433.75"/>
    </g>
    <g fill="#374d31">
      <circle cx="325" cy="134" r="7"/><circle cx="361.25" cy="197" r="7"/>
      <circle cx="397.5" cy="260" r="7"/><circle cx="433.75" cy="323" r="7"/>
    </g>
    <g font-size="24" font-weight="600" text-anchor="end">
      <text x="604" y="141">1</text><text x="604" y="204">5/4</text>
      <text x="604" y="267">3/2</text><text x="604" y="330">7/4</text>
    </g>
    <path d="M36 366H604" stroke="#cccec4"/>
    <text x="36" y="406" font-size="23">5 sites</text>
    <path d="M470 398H497.19" stroke="#ad7838" stroke-width="12"/>
    <path d="M470 386V410M497.19 386V410" stroke="#6c4b24" stroke-width="2"/>
    <text x="36" y="440" font-size="20" fill="#71562e">Unresolved: 2 ≤ K₅ ≤ 35/16 (2.1875)</text>
  </g>
</svg>
