<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img" aria-labelledby="title desc">
  <title id="title">Construction size and proof status for four grids</title>
  <desc id="desc">Side length 3: 8 points, exact optimum. Side length 4: 11 points, exact optimum. Side length 5: 14 points, verified construction. Side length 6: 18 points, verified construction. The larger matching upper bounds rely on one enumerator.</desc>
  <rect width="640" height="490" rx="8" fill="#f7f6f0"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#22251f">
    <text x="36" y="50" font-size="25" font-weight="600">What has been established</text>
    <g font-size="21" fill="#5a5e53"><text x="36" y="108">Grid side</text><text x="174" y="108">Points</text><text x="297" y="108">Status</text></g>
    <g stroke="#d6d9cd"><path d="M36 125H604M36 199H604M36 273H604M36 347H604M36 421H604"/></g>
    <g font-size="26">
      <text x="66" y="173">3</text><text x="191" y="173">8</text><text x="297" y="173" fill="#374d31">Exact optimum</text>
      <text x="66" y="247">4</text><text x="184" y="247">11</text><text x="297" y="247" fill="#374d31">Exact optimum</text>
      <text x="66" y="321">5</text><text x="184" y="321">14</text><text x="297" y="321" font-size="24" fill="#805b2e">Construction</text>
      <text x="66" y="395">6</text><text x="184" y="395">18</text><text x="297" y="395" font-size="24" fill="#805b2e">Construction</text>
    </g>
    <text x="36" y="456" font-size="20" fill="#5a5e53">Larger exclusions still need independent support.</text>
  </g>
</svg>
