<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc">
  <title id="title">A two-dimensional analogy of boundary overlap</title>
  <desc id="desc">Two squares show solid forward arrows from occupied side corners to the outside top-right corner y. In the complete lower square, the other three corners are occupied. In the second square, the lower-left corner z is also outside the set. Dashed reflected arrows from the two occupied corners meet at z, where their maximum contributes once. The proof uses four directions.</desc>
  <rect width="520" height="650" rx="8" fill="#f7f6f0"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#22251f">
    <text x="36" y="44" font-size="25" font-weight="600">When reflected shifts overlap</text>
    <text x="36" y="77" font-size="23" fill="#5a5e53">A two-dimensional analogy</text>
    <circle cx="44" cy="109" r="8" fill="#374d31"/>
    <circle cx="253" cy="109" r="9" fill="#f7f6f0" stroke="#5a5e53" stroke-width="3"/>
    <g font-size="22">
      <text x="62" y="117">Occupied</text>
      <text x="272" y="117">Outside the set</text>
    </g>
    <path d="M36 137H484" stroke="#cccec4"/>

    <text x="36" y="175" font-size="23" font-weight="600">Complete lower square</text>
    <path d="M96 211H226V341H96Z" fill="none" stroke="#dddfd5" stroke-width="2"/>
    <g stroke="#75806a" stroke-width="4">
      <path d="M108 211H202M226 329V235"/>
    </g>
    <g fill="#75806a">
      <polygon points="202,204 214,211 202,218"/>
      <polygon points="219,235 226,223 233,235"/>
    </g>
    <g fill="#374d31">
      <circle cx="96" cy="211" r="8"/>
      <circle cx="96" cy="341" r="8"/>
      <circle cx="226" cy="341" r="8"/>
    </g>
    <circle cx="226" cy="211" r="9" fill="#f7f6f0" stroke="#5a5e53" stroke-width="3"/>
    <text x="247" y="218" font-size="24">y</text>
    <g font-size="22" fill="#374d31">
      <text x="292" y="264">Forward</text>
      <text x="292" y="293">shifts</text>
    </g>

    <path d="M36 369H484" stroke="#cccec4"/>
    <text x="36" y="408" font-size="23" font-weight="600">One lower corner is missing</text>
    <path d="M96 443H226V573H96Z" fill="none" stroke="#dddfd5" stroke-width="2"/>
    <g stroke="#75806a" stroke-width="4">
      <path d="M108 443H202M226 561V467"/>
    </g>
    <g fill="#75806a">
      <polygon points="202,436 214,443 202,450"/>
      <polygon points="219,467 226,455 233,467"/>
    </g>
    <g stroke="#ad7838" stroke-width="4" stroke-dasharray="8 6">
      <path d="M96 455V549M214 573H120"/>
    </g>
    <g fill="#ad7838">
      <polygon points="89,549 96,561 103,549"/>
      <polygon points="120,566 108,573 120,580"/>
    </g>
    <g fill="#374d31">
      <circle cx="96" cy="443" r="8"/>
      <circle cx="226" cy="573" r="8"/>
    </g>
    <g fill="#f7f6f0" stroke="#5a5e53" stroke-width="3">
      <circle cx="226" cy="443" r="9"/>
      <circle cx="96" cy="573" r="9"/>
    </g>
    <g font-size="24">
      <text x="247" y="450">y</text>
      <text x="65" y="580">z</text>
    </g>
    <g font-size="22" fill="#71562e">
      <text x="292" y="489">Reflected</text>
      <text x="292" y="518">shifts meet</text>
      <text x="292" y="547">at z</text>
    </g>
    <text x="36" y="624" font-size="23" font-weight="600">Maximum: one contribution at z</text>
  </g>
</svg>
