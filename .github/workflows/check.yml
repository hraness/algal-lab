name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: python3 -m unittest research.test_tree_certificate research.test_certify_policy_results research.test_terminal_tree research.test_terminal_sampling research.test_terminal_hybrid research.test_survivor_order research.test_ordered_pairing research.test_frugal_experiment research.test_rank_selection research.test_two_failure_groups research.test_intact_groups research.test_context_certificate research.test_stochastic_groups research.test_robust_stochastic_groups research.test_mixture_stochastic_groups research.test_softmax_partition_dp research.test_softmax_partition research.test_softmax_additive_boundary research.test_softmax_additive_flow research.test_softmax_negative_outer

  research:
    name: Research spikes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: python3 research/spikes/structural/verify.py
      - run: python3 research/spikes/weighted-tree/verify.py
      - run: python3 -m research.spikes.ordered.verify
      - run: python3 -m research.spikes.rank.verify
      - run: python3 -m research.spikes.groups.verify
      - run: python3 -m research.spikes.intact.verify
      - run: python3 -m research.spikes.context.verify
      - run: python3 -m research.spikes.stochastic.verify
      - run: python3 -m research.spikes.softmax_partitions.experiment --out research/spikes/context/runs/ci-softmax-partitions

  pipeline:
    name: Demo pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run demo
      - run: bun run lab verify runs/demo
      - run: bun run qualify:instrument
      - run: bun run qualify
      - run: bun run lab verify-qualification runs/qualification
      - run: bun run compare
      - run: bun run lab verify-comparison runs/comparison
      - run: bun run compare:v2
      - run: bun run lab verify-comparison runs/comparison-v2

  required:
    name: Required
    if: always()
    needs: [check, research, pipeline]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          CHECK: ${{ needs.check.result }}
          RESEARCH: ${{ needs.research.result }}
          PIPELINE: ${{ needs.pipeline.result }}
        run: |
          set -euo pipefail
          for result in "$CHECK" "$RESEARCH" "$PIPELINE"; do
            if [[ "$result" != success ]]; then
              printf 'Unexpected required job result: %s\n' "$result"
              exit 1
            fi
          done
